name: Static release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Python syntax, local imports and primary config inheritance
        run: python tools/check_release.py
